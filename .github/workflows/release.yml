name: Build and Release APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:  # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-cleanup: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Get version info
        id: version
        run: |
          VERSION_NAME=$(grep "versionName" app/build.gradle.kts | sed 's/.*versionName.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep "versionCode" app/build.gradle.kts | sed 's/.*versionCode.*=.*\([0-9]*\).*/\1/')
          DATE=$(date +%Y%m%d)
          COMMIT=$(git rev-parse --short HEAD)
          echo "version_name=${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "date=${DATE}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION_NAME}-${DATE}-${COMMIT}" >> $GITHUB_OUTPUT

      - name: Rename Debug APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/LowFace-debug-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.date }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LowFace ${{ steps.version.outputs.version_name }} (${{ steps.version.outputs.date }})
          body: |
            ## LowFace ${{ steps.version.outputs.version_name }}

            ### 📥 下载
            | 文件 | 说明 |
            |------|------|
            | `LowFace-debug-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.date }}.apk` | 调试版本（用于测试） |

            ### 📋 系统要求
            - **最低版本**: Android 7.0 (API 24)
            - **推荐配置**: 2GB RAM, Android 10+
            - **目标设备**: 低端 Android 设备

            ### 🔧 本次更新
            Commit: ${{ steps.version.outputs.commit }}

            ### 📖 文档
            - [README (中文)](https://github.com/${{ github.repository }}/blob/main/README.md)
            - [English README](https://github.com/${{ github.repository }}/blob/main/docs/README.md)

            ---

            **完整更新日志**: https://github.com/${{ github.repository }}/commits/main
          files: |
            app/build/outputs/apk/debug/LowFace-debug-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.date }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LowFace-debug-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.date }}
          path: app/build/outputs/apk/debug/LowFace-debug-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.date }}.apk
          retention-days: 30
